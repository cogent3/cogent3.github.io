format:
  html:
    theme:
      light: cosmo
      dark: darkly
    # doc/custom.css is composed in from the cogent3 repo and owns the styling
    # for cogent3's own rich HTML reprs, so those rules have a single source and
    # cogent3's standalone doc build keeps working. custom.css is site-only
    # branding and loads second so it can override.
    css:
      - doc/custom.css
      - custom.css
    toc: true
    toc-depth: 4
    # cogent3 objects render their own styled HTML tables.
    # Leave them untouched rather than converting them to
    # Bootstrap tables
    html-table-processing: none
    grid:
      sidebar-width: 250px
      body-width: 800px
      margin-width: 250px
      gutter-width: 1.5em

quartodoc:
  package: cogent3
  dir: doc/reference
  parser: numpy
  title: API Reference
  sidebar: doc/reference/_sidebar.yml
  options:
    include_inherited: true
  sections:
    - title: Loading data from file
      desc: Top-level functions for loading data.
      contents:
        - load_seq
        - load_aligned_seqs
        - load_unaligned_seqs
        - parse.table.load_delimited
        - core.table.load_table
        - core.tree.load_tree
        - core.annotation_db.load_annotations
    - title: Making cogent3 objects
      desc: Constructors from standard Python types.
      contents:
        - make_seq
        - core.alignment.make_aligned_seqs
        - core.alignment.make_unaligned_seqs
        - core.table.make_table
        - core.tree.make_tree
    - title: Getting commonly used types
      contents:
        - core.genetic_code.get_code
        - core.moltype.get_moltype
        - evolve.models.get_model
    - title: Listing builtins
      contents:
        - core.genetic_code.available_codes
        - core.moltype.available_moltypes
        - evolve.models.available_models
        - app.available_apps
    - title: Sequences
      desc: Biological sequence objects.
      contents:
        - core.sequence.Sequence
        - core.sequence.DnaSequence
        - core.sequence.RnaSequence
        - core.sequence.ProteinSequence
    - title: Sequence collections & alignments
      contents:
        - core.alignment.SequenceCollection
        - core.alignment.Alignment
        - core.alignment.Aligned
    - title: Sequence storage & views
      contents:
        - core.seq_storage.SeqsData
        - core.seq_storage.AlignedSeqsData
        - core.seqview.SeqView
        - core.seqview.SeqDataView
        - core.seqview.AlignedDataView
        - core.slice_record.SliceRecord
    - title: Annotations
      contents:
        - core.annotation.Feature
        - core.annotation_db.BasicAnnotationDb
        - core.annotation_db.GffAnnotationDb
        - core.annotation_db.GenbankAnnotationDb
    - title: Molecular types & alphabets
      contents:
        - core.moltype.MolType
        - core.genetic_code.GeneticCode
        - core.alphabet.CharAlphabet
        - core.alphabet.KmerAlphabet
        - core.alphabet.SenseCodonAlphabet
        - core.alphabet.PhredEncoding
    - title: Tables
      contents:
        - core.table.Table
        - core.table.Columns
        - parse.table.FilteringParser
    - title: Trees
      contents:
        - core.tree.PhyloNode
