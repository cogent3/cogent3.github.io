# The single source of truth for the cogent3.org website: styling, navigation
# and organisation. The cogent3 repo keeps its own doc/_quarto.yml for building
# and testing its docs in isolation (nox -s testdocs). build.sh deliberately
# excludes that file when it composes the doc tree in here, so exactly one
# config governs the published site.
project:
  type: website
  output-dir: _site
  # build.sh copies the cogent3 doc tree into doc/ (gitignored, regenerated
  # every build) and leaves the doc/cogent3 submodule alone, so the render list
  # names what to build rather than excluding what not to.
  render:
    - "*.qmd"
    - "doc/**/*.qmd"
  # Code cells run with the working directory set to this project root, which is
  # what lets the cogent3 pages say "data/brca1-bats.fasta" from any depth.
  # build.sh symlinks data -> doc/data so that resolves while the files still
  # publish at /doc/data/, preserving those URLs.
  execute-dir: project
  # Leading slashes anchor these to the project root.
  resources:
    - /llms.txt
    - /images/
    - /doc/data/

# the kernel comes from the cogent3 checkout's doc dependency group.
# build.sh points QUARTO_PYTHON at it
jupyter: python3

execute:
  # only re-run a page when its source changes. _freeze/ is not committed, so
  # this is a local convenience and CI renders from scratch
  freeze: auto
  # intentional exception demos are marked per-cell with `#| error: true`
  error: false

bibliography: doc/cogent3.bib

website:
