# The push trigger is disabled while the site is ported from sphinx to quarto.
# The steps below still invoke `make github`, which stops working the moment the
# rst sources are renamed, so leaving it armed would turn every intermediate
# commit into a failed deploy of the live site. Restored once the quarto build
# lands and doc/cogent3 is bumped to a revision that has a _quarto.yml.
on:
  workflow_dispatch:

jobs:
  example-3:
    name: Doc Build
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup python
        uses: "actions/setup-python@v6"
        with:
           python-version: "3.14"

      - name: "Setup virtualenv and install cogent3[dev]"
        if: startsWith(runner.os, 'macOS') || startsWith(runner.os, 'Linux')
        run: |
          python --version
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip list

      - name: Build docs
        shell: bash -l {0}
        working-directory: doc/
        run: |
          source ../.venv/bin/activate
          export PYDEVD_DISABLE_FILE_VALIDATION=1
          make github

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: master
